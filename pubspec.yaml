name: campus_connect
description: "A premium mobile/web marketplace for college campuses built with Flutter and Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.3.6
  go_router: ^10.1.2
  firebase_core: ^2.15.0
  firebase_auth: ^4.7.2
  cloud_firestore: ^4.8.3
  firebase_storage: ^11.2.4
  firebase_messaging: ^14.6.4
  google_sign_in: ^6.1.4
  shared_preferences: ^2.2.0
  intl: ^0.18.1
  uuid: ^3.0.7
  image_picker: ^1.0.2
  flutter_image_compress: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/
